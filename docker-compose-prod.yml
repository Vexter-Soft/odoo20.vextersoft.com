services:
  db:
    image: postgres:16-alpine
    container_name: odoo20-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${ODOO20_DB_PASSWORD:?Set a database password}
    volumes:
      - odoo20-db-data:/var/lib/postgresql/data
    networks:
      - odoo20-private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    image: odoo:20.0
    container_name: odoo20-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      PORT: 5432
      USER: odoo
      PASSWORD: ${ODOO20_DB_PASSWORD:?Set a database password}
    volumes:
      - odoo20-web-data:/var/lib/odoo
      - ./addons/stratos_crm_rfp_20.0.1.1.0/stratos_crm_rfp:/mnt/extra-addons/stratos_crm_rfp
      - ./addons/stratos_social_20.0.1.2.0/stratos_social:/mnt/extra-addons/stratos_social
    networks:
      - odoo20-private
      - vextersoft-tunnel-egress

volumes:
  odoo20-db-data:
  odoo20-web-data:

networks:
  odoo20-private:
    internal: true
  vextersoft-tunnel-egress:
    external: true
    name: vextersoft-tunnel-egress
