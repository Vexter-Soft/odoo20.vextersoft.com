services:
  db:
    image: postgres:16-alpine
    container_name: odoo20-local-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${ODOO20_DB_PASSWORD:?Set a database password}
    volumes:
      - odoo20-local-db-data:/var/lib/postgresql/data
    networks:
      - odoo20-local-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: odoo20-web:custom
    container_name: odoo20-local-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ODOO20_PORT:-8020}:8069"
    environment:
      HOST: db
      PORT: 5432
      USER: odoo
      PASSWORD: ${ODOO20_DB_PASSWORD:?Set a database password}
    volumes:
      - odoo20-local-web-data:/var/lib/odoo
      - ./addons/stratos_crm_rfp_20.0.1.1.0/stratos_crm_rfp:/mnt/extra-addons/stratos_crm_rfp
      - ./addons/stratos_social_20.0.1.2.0/stratos_social:/mnt/extra-addons/stratos_social
    networks:
      - odoo20-local-net

volumes:
  odoo20-local-db-data:
  odoo20-local-web-data:

networks:
  odoo20-local-net:
    driver: bridge
